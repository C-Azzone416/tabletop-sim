name: Prod Smoke Check

# Production counterpart of staging-smoke.yml (issue #174). Guards the
# env-var-scope incident class: AUTH_SECRET existed in Vercel Preview scope
# but not Production, so prod /api/auth/* 500'd from v0.2.0 onward with
# nothing exercising it. Checks: Render prod /health -> 200, Vercel prod
# /api/auth/session -> 200, and POST /dev/seed -> 404 on both hosts (the
# fail-closed dev-tooling gate holds where NODE_ENV=production is correct).
#
# Neither Render nor Vercel deploys are wired to a GitHub Actions trigger, so
# a push-to-main run may race the platform deploy and probe the previous
# deployment; that's acceptable because these are env-scope invariants rather
# than code checks, and the 30-minute schedule is the backstop that catches
# post-deploy drift regardless. workflow_dispatch/repository_dispatch allow
# on-demand runs or a future deploy webhook.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [prod-deployed]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check prod health, auth config, and dev-tooling gate
        # vars.* with the real prod URLs as fallbacks — unlike staging (which
        # skips gracefully when unconfigured), prod URLs are stable and known,
        # and this check exists because silent non-coverage of prod went
        # unnoticed; defaulting on means it can never silently not-run.
        run: >-
          npx tsx scripts/prod-smoke-check.ts
          "${{ vars.PROD_SERVER_URL || 'https://tabletop-sim.onrender.com' }}"
          "${{ vars.PROD_CLIENT_URL || 'https://tabletop-sim.vercel.app' }}"
