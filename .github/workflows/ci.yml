name: CI

on:
  pull_request:
    branches:
      - develop
  # #248 — per-PR green describes a pre-merge branch state, never the merged
  # result. #228 + #241 each passed CI alone and turned develop red combined;
  # nothing caught that until a human ran the suite locally. This makes "is
  # develop green?" a fact CI produces on its own instead of a policy someone
  # has to remember to check.
  push:
    branches:
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest

    # Local-stack E2E (decision: #decisions, 2026-07-22 — no staging secrets,
    # no Vercel SSO). These are fixed, non-sensitive config values (not
    # secrets.*) so they're safe as plain job-level env vars.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tabletop_test
      ENABLE_DEV_SEED: 'true'
      NODE_ENV: test
      PORT: '3001'
      NEXT_PUBLIC_SERVER_URL: http://localhost:3001
      NEXT_PUBLIC_ENABLE_DEV_TOOLS: 'true'
      AUTH_SECRET: e2e-ci-local-stack-not-a-real-secret

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tabletop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx tsx db/migrate.ts "$DATABASE_URL"

      - name: Build shared
        run: npm run build -w packages/shared

      - name: Build cards
        run: npm run build -w packages/cards

      - name: Build game-spades
        run: npm run build -w packages/games/spades

      - name: Build game-flip
        run: npm run build -w packages/games/flip

      - name: Type check (server)
        run: npx tsc --noEmit -p packages/server/tsconfig.json

      - name: Type check (client)
        run: |
          mkdir -p packages/client/.next/types
          printf '// generated stub\nexport {};\n' > packages/client/.next/types/routes.d.ts
          npx tsc --noEmit -p packages/client/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test --workspaces --if-present

      - name: Test coverage (server)
        run: npm run test:coverage -w packages/server

      - name: Test coverage (client)
        run: npm run test:coverage -w packages/client

      - name: Build server + client (for E2E)
        run: |
          npm run build -w packages/server
          npm run build -w packages/client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/client

      - name: E2E tests (local stack)
        run: npm run test:e2e -w packages/client

      - name: Check migrations
        run: npm run check:migrations

      # #417 Check A — static, ~1s: every @tabletop/* workspace dependency
      # of packages/server and packages/client must be built, in order,
      # before its dependent, in every real build chain (root package.json's
      # build/build:server scripts, this file, render.yaml, vercel.json).
      # This is the fast first signal, not the proof — see Check B below,
      # which is authoritative if the two ever disagree.
      - name: Check build order
        run: npm run check:build-order

      # #417 Check D — every process.env reference in packages/server/src
      # and packages/client/app must be documented in that package's
      # .env.example (commented-out counts), so a var that works locally
      # and is unset on Vercel/Render is visible in review instead of
      # silent.
      - name: Check env var parity
        run: npm run check:env-parity

      # #417 Check B (highest value) — proves the build ORDER actually
      # works by running render.yaml's own buildCommand verbatim, from a
      # genuinely clean tree. This is stronger than Check A above because
      # it does not compare strings: it executes the exact command Render
      # runs, so CI cannot drift from what the deploy actually does. If
      # Check A and this ever disagree, THIS is authoritative.
      #
      # The clean step is not optional — a warm dist/ hides exactly this
      # failure, which is what made PR #368's first CI run red (a stale
      # local dist masked a missing build-chain entry that a fresh install
      # would have caught immediately).
      - name: Verify render.yaml build command builds cleanly
        run: |
          rm -rf packages/*/dist packages/games/*/dist
          CMD=$(grep -m1 '^[[:space:]]*buildCommand:' render.yaml | sed 's/^[[:space:]]*buildCommand:[[:space:]]*//')
          if [ -z "$CMD" ]; then
            echo "ERROR: could not find a buildCommand: line in render.yaml" >&2
            exit 1
          fi
          echo "Running render.yaml's buildCommand verbatim: $CMD"
          bash -c "$CMD"

      # #185 — hard gate against advisory drift (#175's post-triage state was
      # 0 advisories, so this starts green). audit-level=high fails on
      # high/critical; low/moderate stay visible in the job log without
      # blocking, matching the triage's own severity split.
      #
      # #302 (Caroline's ruling, Option 2): moved from step 4 to last. ci.yml
      # is one sequential job — a failure here used to skip the twelve steps
      # after it, so a red `ci` from an audit failure and a red `ci` from
      # "nothing ran" (#284) looked identical. Last means every other step
      # still runs and reports before this can trip; the gate still blocks
      # the merge either way; only its position moved. Not a job split —
      # that's #307, filed and explicitly out of scope here.
      - name: Security audit (npm)
        run: npm audit --audit-level=high
