name: CI

on:
  pull_request:
    branches:
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w packages/shared

      - name: Type check (server)
        run: npx tsc --noEmit -p packages/server/tsconfig.json

      - name: Type check (client)
        run: |
          mkdir -p packages/client/.next/types
          printf '// generated stub\nexport {};\n' > packages/client/.next/types/routes.d.ts
          npx tsc --noEmit -p packages/client/tsconfig.json

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test --workspaces --if-present

      - name: Test coverage (server)
        run: npm run test:coverage -w packages/server

      - name: Test coverage (client)
        run: npm run test:coverage -w packages/client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/client

      - name: E2E tests (staging)
        if: ${{ vars.E2E_STAGING_CONFIGURED == 'true' }}
        run: npm run test:e2e -w packages/client
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}

      - name: Check migrations
        run: npm run check:migrations
