name: Staging Smoke Check

# Post-merge check for the dev-tooling gate on staging (issue #122, moved from
# a schedule to a develop-push job by #345). PR #98's fail-closed gate
# (ENABLE_DEV_SEED === 'true' && NODE_ENV !== 'production') silently disabled
# /dev/* routes on staging for ~26 hours because Render defaults Node services
# to NODE_ENV=production — nothing caught it until a human noticed manually.
#
# #345 — staging has no users, so a per-merge check loses almost no detection
# latency versus a 30-minute poll while attaching the signal to an actual
# change. This is its own job in its own workflow file (not folded into
# ci.yml), so a staging outage/cold-start can never skip or fail the
# build/test job — see #302 for the failure mode this must not reproduce.
# workflow_dispatch/repository_dispatch stay for on-demand runs and a future
# deploy trigger (#286).
on:
  push:
    branches:
      - develop
  workflow_dispatch: {}
  repository_dispatch:
    types: [staging-deployed]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check dev tooling is reachable and CORS-correct on staging
        # vars.* (not secrets.*) — a server URL and an origin string aren't
        # sensitive. Gracefully skips (exit 0) if unconfigured, same pattern
        # as the old E2E_STAGING_CONFIGURED gate.
        #
        # #262 — secrets.STAGING_API_ACCESS_KEY lets this check get past
        # #252's access gate (once API_ACCESS_KEY is configured on staging)
        # to actually observe the #98/#121 invariants it exists to verify.
        #
        # #469 swept this file: safe. Every ${{ }} here is vars.*/secrets.*
        # (repo-admin-configured, never attacker-influenceable text), and
        # this workflow has no pull_request trigger — nothing here is
        # reachable from anything a PR author controls.
        run: npx tsx scripts/staging-smoke-check.ts "${{ vars.STAGING_SERVER_URL }}" "${{ vars.STAGING_ORIGIN }}" "${{ secrets.STAGING_API_ACCESS_KEY }}"

      # #481 (Check C, split from #417) — the check that would have caught
      # #413/#414: A/B (#417) verify the BUILD is correct; this is the only
      # one that verifies a push actually REACHED a running server. Polls
      # /version and fails if it never reports this exact pushed commit.
      #
      # Reuses the same secrets/vars as the step above (#262, added by
      # #262 itself) rather than adding new ones — same host, same gate.
      #
      # Deliberate choice on failure path, per the PM's ask to state this
      # explicitly: FAILS THE WORKFLOW (loud — a red check on the commit
      # in the Actions tab), same as the step above, rather than a quieter
      # issue/board post. This runs post-merge and can't block anything,
      # but #413/#414 sat unnoticed specifically because nothing was loud
      # about it; a check that fails silently into a channel nobody is
      # watching would reproduce the exact gap this issue exists to close.
      # No new notification mechanism — extends the existing pattern this
      # workflow already uses.
      #
      # #469-safe for the same reason as the step above: every ${{ }} here
      # is either vars.*/secrets.* or github.sha (the actual SHA of the
      # commit GitHub just ran this workflow for for — not text a PR author
      # can shape), and this workflow has no pull_request trigger.
      - name: Check the deployed commit matches the pushed commit
        run: npx tsx scripts/deployed-sha-check.ts "${{ vars.STAGING_SERVER_URL }}" "${{ github.sha }}" "${{ secrets.STAGING_API_ACCESS_KEY }}"
